# ResumeMate Docker Compose
# 映像由 scripts/build-backend.sh 建置，啟動方式參考 scripts/docker-run.sh
#
# 使用方式：
#   docker compose up -d          # 啟動容器（背景）
#   docker compose logs -f        # 查看日誌
#   docker compose down           # 停止並移除容器

services:
  resumemate:
    image: sacahan/resumemate:latest
    container_name: resumemate
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-7860}:${GRADIO_SERVER_PORT:-7860}"
    volumes:
      - ./logs:/app/logs
    env_file:
      - ../.env
    environment:
      TZ: Asia/Taipei
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${GRADIO_SERVER_PORT:-7860}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sacahan-network

networks:
  sacahan-network:
    name: sacahan-network
    external: true
