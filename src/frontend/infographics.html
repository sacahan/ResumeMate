<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>資訊圖表蒐集 — Brian Han</title>
  <link rel="icon" type="image/png" href="static/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/css/design.css" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"CollectionPage","name":"Infographics Gallery","description":"A collection of infographics created or curated by Brian Han","author":{"@type":"Person","name":"Brian Han","url":"https://www.brianhan.cc/"}}
  </script>
</head>
<body>

<!-- Ambient glow orbs -->
<div style="position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;">
  <div style="position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,26,.13) 0%,transparent 70%);top:-120px;right:-100px;animation:ambientA 12s ease-in-out infinite;"></div>
  <div style="position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(255,160,60,.09) 0%,transparent 70%);bottom:-80px;left:-60px;animation:ambientB 16s ease-in-out infinite;"></div>
</div>

<!-- Navigation -->
<nav style="position:fixed;top:0;left:0;right:0;z-index:100;background:var(--navbg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);">
  <div style="max-width:1100px;margin:0 auto;padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--accent);text-decoration:none;">BH.</a>
    <div style="display:flex;align-items:center;gap:28px;">
      <a href="index.html#about" class="nav-link">關於我</a>
      <a href="index.html#career" class="nav-link">經歷</a>
      <a href="index.html#work" class="nav-link">作品</a>
      <a href="index.html#hub" class="nav-link">內容</a>
      <a href="infographics.html" style="text-decoration:none;font-size:14px;font-weight:700;color:var(--accent);">資訊圖表</a>
      <a href="index.html#chat" class="nav-link">AI 問答</a>
    </div>
    <div style="display:flex;align-items:center;gap:4px;background:var(--whiteSoft);border:1px solid var(--border);border-radius:10px;padding:4px;">
      <button id="lang-zh" class="lang-active" onclick="setLang('zh')" style="border-radius:7px;">中</button>
      <button id="lang-en" class="lang-inactive" onclick="setLang('en')" style="border-radius:7px;">EN</button>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main style="padding-top:96px;padding-bottom:80px;min-height:100vh;position:relative;z-index:1;">
  <div style="max-width:1100px;margin:0 auto;padding:0 28px;">

    <!-- Page Header -->
    <section style="margin-bottom:48px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
        <div style="width:4px;height:36px;background:linear-gradient(180deg,var(--accentGradA),var(--accentGradB));border-radius:2px;"></div>
        <h1 id="page-title" style="margin:0;font-size:32px;font-weight:700;color:var(--text);">資訊圖表蒐集</h1>
      </div>
      <p id="page-desc" style="margin:0 0 0 16px;font-size:16px;color:var(--muted2);padding-left:16px;">我蒐集或創造的資訊圖表，涵蓋技術、數據視覺化等主題</p>
    </section>

    <!-- Gallery Container (infographics.js injects filter tags + grid here) -->
    <section id="infographics-container">
      <div class="infographic-loading">
        <div style="display:flex;gap:6px;">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dotty 1.2s ease-in-out infinite;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dotty 1.2s ease-in-out infinite .2s;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:var(--accent);animation:dotty 1.2s ease-in-out infinite .4s;"></span>
        </div>
      </div>
    </section>

  </div>
</main>

<!-- Footer -->
<footer style="background:var(--surface);border-top:1px solid var(--border);padding:40px 0;position:relative;z-index:1;">
  <div style="max-width:1100px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
    <a href="index.html" class="nav-link" id="back-link">← 返回首頁</a>
    <p style="margin:0;font-size:13px;color:var(--muted2);" id="footer-copy">© 2025 Brian Han. 保留所有權利。</p>
  </div>
</footer>

<script>
  // Minimal lang switcher for this standalone page
  let _lang = 'zh';

  const strings = {
    zh: {
      pageTitle: '資訊圖表蒐集',
      pageDesc: '我蒐集或創造的資訊圖表，涵蓋技術、數據視覺化等主題',
      backLink: '← 返回首頁',
      footerCopy: '© 2025 Brian Han. 保留所有權利。',
    },
    en: {
      pageTitle: 'Infographics Gallery',
      pageDesc: "A collection of infographics I've curated or created, covering technology, data visualization, and more",
      backLink: '← Back to Home',
      footerCopy: '© 2025 Brian Han. All rights reserved.',
    },
  };

  function setLang(lang) {
    _lang = lang;
    document.getElementById('lang-zh').className = lang === 'zh' ? 'lang-active' : 'lang-inactive';
    document.getElementById('lang-en').className = lang === 'en' ? 'lang-active' : 'lang-inactive';
    const s = strings[lang];
    document.getElementById('page-title').textContent = s.pageTitle;
    document.getElementById('page-desc').textContent = s.pageDesc;
    document.getElementById('back-link').textContent = s.backLink;
    document.getElementById('footer-copy').textContent = s.footerCopy;
    document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
    if (window.infographicsGallery) {
      window.infographicsGallery.renderGallery();
    }
  }

  window.getCurrentLang = () => _lang;


</script>

<!-- Infographics Gallery (handles filter, grid, lightbox logic) -->
<script src="static/js/infographics.js"></script>

</body>
</html>
