<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>韓世翔 Brian Han — AI Application Engineer</title>
<link rel="icon" type="image/png" href="static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/design.css">
</head>
<body>
<div id="site-root" style="min-height:100vh;overflow-x:hidden;">

<!-- Ambient breathing glow -->
<div aria-hidden="true" style="pointer-events:none;position:fixed;inset:0;z-index:0;overflow:hidden;opacity:var(--ambient,1);transition:opacity .5s;">
  <div style="position:absolute;top:-20%;left:-10%;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB),.55) 0%,transparent 65%);filter:blur(70px);animation:ambientA 7s ease-in-out infinite;"></div>
  <div style="position:absolute;bottom:-20%;right:-10%;width:50vw;height:50vw;border-radius:50%;background:radial-gradient(circle,rgba(var(--accentRGB2),.45) 0%,transparent 65%);filter:blur(80px);animation:ambientB 9s ease-in-out infinite;"></div>
</div>

<!-- NAV -->
<nav style="position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 40px;background:var(--navbg);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);">
  <div style="display:flex;align-items:center;gap:12px;">
    <div style="width:34px;height:34px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 2px var(--accent),0 0 18px rgba(var(--accentRGB),.45);flex:none;background:var(--whiteSoft);">
      <img src="static/images/avatar.jpg" alt="韓世翔" style="width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block;" onerror="this.style.display='none'">
    </div>
    <div style="display:flex;flex-direction:column;line-height:1.1;">
      <span id="nav-brand" style="font-weight:700;font-size:15px;letter-spacing:.5px;color:var(--text);"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--accentBright);text-transform:uppercase;margin-top:3px;">AI ENGINEER</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:18px;">
    <div style="display:flex;align-items:center;gap:18px;">
      <a id="nav-about"   href="#about"       class="nav-link"></a>
      <a id="nav-career"  href="#career"      class="nav-link"></a>
      <a id="nav-work"    href="#work"        class="nav-link"></a>
      <a id="nav-content" href="#content-hub" class="nav-link"></a>
      <a id="nav-chat"    href="#chat"        class="nav-link-accent"></a>
    </div>
    <div style="display:flex;border:1px solid var(--border2);border-radius:999px;overflow:hidden;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;">
      <button id="btn-zh" onclick="setLang('zh')" class="lang-active">中</button>
      <button id="btn-en" onclick="setLang('en')" class="lang-inactive">EN</button>
    </div>
  </div>
</nav>

<!-- Variant switcher (floating) -->
<div style="position:fixed;right:18px;bottom:18px;z-index:90;display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--border2);border-radius:999px;backdrop-filter:blur(10px);box-shadow:0 10px 30px var(--shadow);">
  <span id="hero-label" style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--muted2);text-transform:uppercase;padding-left:4px;"></span>
  <button id="v1-btn" onclick="setHeroVariant(1)" class="pill-active">A</button>
  <button id="v2-btn" onclick="setHeroVariant(2)" class="pill-inactive">B</button>
  <button id="v3-btn" onclick="setHeroVariant(3)" class="pill-inactive">C</button>
</div>

<!-- ============ HERO A ============ -->
<header id="hero-a" style="position:relative;padding:80px 40px 96px;max-width:1240px;margin:0 auto;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:46px 46px;pointer-events:none;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%);"></div>
  <div style="position:absolute;top:-120px;left:-80px;width:520px;height:520px;background:radial-gradient(circle,rgba(var(--accentRGB),.22),transparent 62%);filter:blur(10px);pointer-events:none;animation:pulseGlow 6s ease-in-out infinite;"></div>
  <div style="position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center;">
    <div>
      <div style="display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid rgba(var(--accentRGB),.35);border-radius:999px;background:rgba(var(--accentRGB),.08);margin-bottom:26px;">
        <span style="width:8px;height:8px;border-radius:50%;background-color:#36d399;box-shadow:0 0 10px #36d399;"></span>
        <span id="hero-a-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--accentBright);text-transform:uppercase;"></span>
      </div>
      <h1 style="margin:0 0 22px;font-size:64px;line-height:1.06;font-weight:900;letter-spacing:-1.5px;color:var(--text);">
        <span id="hero-a-t1"></span><br>
        <span id="hero-a-t2" style="color:var(--accent);"></span>
      </h1>
      <p id="hero-a-sub" style="margin:0 0 34px;max-width:480px;font-size:18px;line-height:1.7;color:var(--muted);font-weight:300;"></p>
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <a href="#contact" class="btn-primary"><span id="cta-primary-a"></span> →</a>
        <a href="#career"  class="btn-secondary" id="cta-secondary-a"></a>
      </div>
      <div style="display:flex;gap:38px;margin-top:46px;">
        <div><div id="stat1n" style="font-size:32px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="stat1l" style="font-size:13px;color:var(--muted2);margin-top:2px;"></div></div>
        <div><div id="stat2n" style="font-size:32px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="stat2l" style="font-size:13px;color:var(--muted2);margin-top:2px;"></div></div>
        <div><div id="stat3n" style="font-size:32px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="stat3l" style="font-size:13px;color:var(--muted2);margin-top:2px;"></div></div>
      </div>
    </div>
    <!-- Chat window -->
    <div id="chat" style="position:relative;animation:floaty 7s ease-in-out infinite;">
      <div style="border-radius:16px;background:#15171d;border:1px solid rgba(255,255,255,.09);box-shadow:0 30px 70px var(--shadow);overflow:hidden;">
        <div style="display:flex;align-items:center;gap:7px;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.07);background:#1a1c23;">
          <span style="width:11px;height:11px;border-radius:50%;background:#ff5f56;"></span>
          <span style="width:11px;height:11px;border-radius:50%;background:#ffbd2e;"></span>
          <span style="width:11px;height:11px;border-radius:50%;background:#27c93f;"></span>
          <span style="margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b6f7b;">AI 問答</span>
          <span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:#36d399;">
            <span style="width:7px;height:7px;border-radius:50%;background:#36d399;box-shadow:0 0 8px #36d399;"></span>online
          </span>
        </div>
        <div id="chat-messages" style="min-height:190px;max-height:300px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background:#15171d;"></div>
        <div style="padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);background:#15171d;">
          <div id="chat-suggestions" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;"></div>
          <div style="display:flex;gap:8px;">
            <input id="chat-input" onkeydown="handleChatKey(event)" oninput="chatInputVal=this.value" style="flex:1;min-width:0;padding:11px 13px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14);color:#f4f4f5;font-family:'Noto Sans TC',sans-serif;font-size:14px;outline:none;">
            <button onclick="sendMessage()" id="chat-send-btn" style="padding:11px 16px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accentGradA),var(--accentGradB));color:#0e0f13;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- ============ HERO B ============ -->
<header id="hero-b" style="display:none;position:relative;padding:96px 40px 104px;overflow:hidden;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(var(--accentRGB),.16),transparent 55%);pointer-events:none;"></div>
  <div style="position:relative;max-width:920px;margin:0 auto;text-align:center;">
    <div style="display:inline-flex;align-items:center;gap:9px;padding:7px 14px;border:1px solid rgba(var(--accentRGB),.35);border-radius:999px;background:rgba(var(--accentRGB),.08);margin-bottom:34px;">
      <span id="hero-b-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--accentLight);text-transform:uppercase;"></span>
    </div>
    <h1 id="hero-b-t1" style="margin:0 0 8px;font-size:84px;line-height:1.02;font-weight:900;letter-spacing:-2.5px;color:var(--text);"></h1>
    <h1 style="margin:0 0 26px;font-size:84px;line-height:1.02;font-weight:900;letter-spacing:-2.5px;color:var(--accent);position:relative;display:inline-block;">
      <span id="hero-b-t2"></span>
      <span style="position:absolute;left:0;right:0;bottom:6px;height:14px;background:rgba(var(--accentRGB),.22);z-index:-1;border-radius:4px;"></span>
    </h1>
    <p id="hero-b-sub" style="margin:0 auto 38px;max-width:560px;font-size:19px;line-height:1.7;color:var(--muted);font-weight:300;"></p>
    <div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;">
      <a href="#contact" class="btn-primary"><span id="cta-primary-b"></span> →</a>
      <a href="#work"    class="btn-secondary" id="cta-secondary-b"></a>
    </div>
    <div style="display:flex;gap:0;margin-top:64px;justify-content:center;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--surface);">
      <div style="flex:1;padding:26px 30px;border-right:1px solid var(--border);"><div id="b-stat1n" style="font-size:34px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="b-stat1l" style="font-size:13px;color:var(--muted2);margin-top:4px;"></div></div>
      <div style="flex:1;padding:26px 30px;border-right:1px solid var(--border);"><div id="b-stat2n" style="font-size:34px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="b-stat2l" style="font-size:13px;color:var(--muted2);margin-top:4px;"></div></div>
      <div style="flex:1;padding:26px 30px;">                                  <div id="b-stat3n" style="font-size:34px;font-weight:900;color:var(--accent);font-family:'JetBrains Mono',monospace;"></div><div id="b-stat3l" style="font-size:13px;color:var(--muted2);margin-top:4px;"></div></div>
    </div>
  </div>
</header>

<!-- ============ HERO C ============ -->
<header id="hero-c" style="display:none;position:relative;min-height:560px;overflow:hidden;">
  <div style="display:grid;grid-template-columns:1fr 1fr;min-height:560px;">
    <div style="position:relative;padding:80px 40px 80px 7vw;display:flex;flex-direction:column;justify-content:center;background:var(--surface);border-right:1px solid var(--border);">
      <div style="position:absolute;bottom:-100px;left:-60px;width:380px;height:380px;background:radial-gradient(circle,rgba(var(--accentRGB),.18),transparent 62%);pointer-events:none;"></div>
      <div style="position:relative;">
        <div id="hero-c-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:20px;"></div>
        <h1 id="hero-c-t1" style="margin:0 0 16px;font-size:58px;line-height:1.05;font-weight:900;letter-spacing:-1.5px;color:var(--text);"></h1>
        <div style="height:4px;width:64px;background:var(--accent);border-radius:4px;margin-bottom:22px;"></div>
        <p id="hero-c-sub" style="margin:0 0 34px;max-width:420px;font-size:17px;line-height:1.75;color:var(--muted);font-weight:300;"></p>
        <div style="display:flex;gap:14px;flex-wrap:wrap;">
          <a href="#contact" class="btn-primary" style="padding:14px 24px;"><span id="cta-primary-c"></span> →</a>
          <a href="#work"    class="btn-secondary" id="cta-secondary-c" style="padding:14px 24px;"></a>
        </div>
      </div>
    </div>
    <div style="position:relative;display:flex;align-items:center;justify-content:center;padding:56px;background:var(--bg);background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:40px 40px;">
      <div style="width:100%;max-width:360px;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:1px solid var(--border2);box-shadow:0 30px 70px var(--shadow);background:var(--surface2);display:flex;align-items:center;justify-content:center;">
        <img src="static/images/portrait.jpg" alt="Brian Han" style="width:100%;height:100%;object-fit:cover;object-position:center 10%;display:block;" onerror="this.style.display='none'">
      </div>
    </div>
  </div>
</header>

<!-- ============ ABOUT ============ -->
<section id="about" style="max-width:1200px;margin:0 auto;padding:84px 40px;">
  <div style="display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:start;">
    <div style="position:sticky;top:100px;">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:26px;">
        <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--accent),0 8px 24px var(--shadow);background:var(--whiteSoft);">
          <img src="static/images/avatar.jpg" alt="韓世翔" style="width:100%;height:100%;object-fit:cover;object-position:center 15%;display:block;" onerror="this.style.display='none'">
        </div>
        <div>
          <div id="about-brand" style="font-size:21px;font-weight:800;color:var(--text);"></div>
          <div id="about-role"  style="font-size:13px;color:var(--muted2);margin-top:3px;"></div>
        </div>
      </div>
      <div id="about-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:14px;"></div>
      <h2 id="about-title" style="margin:0 0 24px;font-size:40px;font-weight:900;letter-spacing:-.5px;line-height:1.15;color:var(--text);"></h2>
      <div id="skills-grid" style="display:flex;flex-wrap:wrap;gap:9px;margin-top:24px;"></div>
    </div>
    <div>
      <p id="about-p1" style="margin:0 0 22px;font-size:18px;line-height:1.85;color:var(--text2);font-weight:300;"></p>
      <p id="about-p2" style="margin:0 0 22px;font-size:18px;line-height:1.85;color:var(--muted);font-weight:300;"></p>
      <p id="about-p3" style="margin:0;font-size:18px;line-height:1.85;color:var(--muted);font-weight:300;"></p>
    </div>
  </div>
</section>

<!-- ============ CAREER ============ -->
<section id="career" style="background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
  <div style="max-width:1200px;margin:0 auto;padding:84px 40px;">
    <div id="career-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:14px;"></div>
    <h2 id="career-title" style="margin:0 0 50px;font-size:40px;font-weight:900;letter-spacing:-.5px;color:var(--text);"></h2>
    <div id="career-list" style="display:flex;flex-direction:column;"></div>
  </div>
</section>

<!-- ============ WORK ============ -->
<section id="work" style="max-width:1200px;margin:0 auto;padding:84px 40px;">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:44px;flex-wrap:wrap;">
    <div>
      <div id="work-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:14px;"></div>
      <h2 id="work-title" style="margin:0;font-size:40px;font-weight:900;letter-spacing:-.5px;color:var(--text);"></h2>
    </div>
    <p id="work-sub" style="margin:0;max-width:380px;font-size:15px;line-height:1.7;color:var(--muted2);font-weight:300;"></p>
  </div>
  <div id="work-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;"></div>
</section>

<!-- ============ CONTENT HUB ============ -->
<section id="content-hub" style="max-width:1200px;margin:0 auto;padding:84px 40px;">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:44px;flex-wrap:wrap;">
    <div>
      <div id="content-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:14px;"></div>
      <h2 id="content-title" style="margin:0;font-size:40px;font-weight:900;letter-spacing:-.5px;color:var(--text);"></h2>
    </div>
    <p id="content-sub" style="margin:0;max-width:380px;font-size:15px;line-height:1.7;color:var(--muted2);font-weight:300;"></p>
  </div>
  <div style="display:flex;gap:12px;margin-bottom:36px;border-bottom:1px solid var(--border);">
    <button id="tab-art-btn"   onclick="setContentTab('articles')"    style="padding:12px 24px;border:none;background:none;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;border-bottom:2px solid var(--accentBright);transition:all .3s;"></button>
    <button id="tab-chart-btn" onclick="setContentTab('infographics')" style="padding:12px 24px;border:none;background:none;font-family:'Noto Sans TC',sans-serif;font-size:15px;font-weight:700;color:var(--muted2);cursor:pointer;border-bottom:2px solid transparent;transition:all .3s;"></button>
  </div>

  <!-- Articles tab -->
  <div id="tab-articles">
    <div style="display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start;">
      <div id="articles-list" style="display:flex;flex-direction:column;gap:18px;"></div>
      <aside style="display:flex;flex-direction:column;gap:24px;position:sticky;top:100px;">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;">
          <h4 id="cat-label" style="margin:0 0 16px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accentBright);"></h4>
          <div id="cats-list" style="display:flex;flex-direction:column;gap:2px;"></div>
        </div>
        <div style="background:linear-gradient(160deg,rgba(var(--accentRGB),.14),rgba(var(--accentRGB),.03));border:1px solid rgba(var(--accentRGB),.25);border-radius:14px;padding:22px;">
          <h4 id="sub-title" style="margin:0 0 8px;font-size:16px;font-weight:700;color:var(--text);"></h4>
          <p  id="sub-sub"   style="margin:0 0 14px;font-size:13px;line-height:1.6;color:var(--muted);font-weight:300;"></p>
          <div style="display:flex;gap:8px;">
            <input id="sub-input" style="flex:1;min-width:0;padding:10px 12px;border-radius:9px;background:var(--inputbg);border:1px solid var(--border2);color:var(--text);font-family:'Noto Sans TC',sans-serif;font-size:13px;outline:none;">
            <button id="sub-btn" style="padding:10px 14px;border-radius:9px;border:none;background:var(--accent);color:#0e0f13;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;"></button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Infographics tab -->
  <div id="tab-infographics" style="display:none;">
    <div id="hub-infographics"></div>
  </div>
</section>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;align-items:center;justify-content:center;padding:20px;cursor:pointer;">
  <div onclick="event.stopPropagation()" style="max-width:90vw;max-height:90vh;position:relative;cursor:default;">
    <button onclick="closeLightbox()" style="position:absolute;top:-40px;right:0;background:none;border:none;color:var(--accentBright);font-size:32px;cursor:pointer;">&#x2715;</button>
    <img id="lightbox-img" src="" alt="infographic" style="max-width:100%;max-height:90vh;border-radius:12px;box-shadow:0 40px 100px rgba(0,0,0,.6);">
  </div>
</div>

<!-- ============ CONTACT ============ -->
<footer id="contact" style="position:relative;padding:90px 40px 50px;text-align:center;overflow:hidden;">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(var(--accentRGB),.18),transparent 60%);pointer-events:none;"></div>
  <div style="position:relative;max-width:680px;margin:0 auto;">
    <div id="contact-eyebrow" style="font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:2px;color:var(--accentBright);text-transform:uppercase;margin-bottom:18px;"></div>
